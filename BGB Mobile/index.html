<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Realistic Growing Plant</title>

<style>
body {
  margin: 0;
  overflow: hidden;
  background: #f3f3ef;
}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

</head>
<body>

<script>

/* -------------------- */
/* SCENE */
/* -------------------- */

const scene = new THREE.Scene();

scene.background = new THREE.Color(0xf3f3ef);

const camera = new THREE.PerspectiveCamera(
  50,
  window.innerWidth / window.innerHeight,
  0.1,
  1000
);

camera.position.z = 18;
camera.position.y = 4;

const renderer = new THREE.WebGLRenderer({
  antialias: true
});

renderer.setSize(
  window.innerWidth,
  window.innerHeight
);

document.body.appendChild(renderer.domElement);

/* -------------------- */
/* LIGHT */
/* -------------------- */

const light = new THREE.DirectionalLight(
  0xffffff,
  1.4
);

light.position.set(10, 20, 10);

scene.add(light);

scene.add(
  new THREE.AmbientLight(0xffffff, 0.9)
);

/* -------------------- */
/* STEM MATERIAL */
/* -------------------- */

const stemMaterial =
  new THREE.MeshStandardMaterial({
    color: 0x3d2b1f,
    roughness: 1
  });

const leafMaterial =
  new THREE.MeshStandardMaterial({
    color: 0x5f8f45,
    roughness: 0.8,
    side: THREE.DoubleSide
  });

/* -------------------- */
/* LEAF */
/* -------------------- */

function createLeaf(x, y, z, rotY) {

  const shape = new THREE.Shape();

  shape.moveTo(0, 0);

  shape.bezierCurveTo(
    0.4, 0.8,
    0.8, 1.2,
    0, 2
  );

  shape.bezierCurveTo(
    -0.8, 1.2,
    -0.4, 0.8,
    0, 0
  );

  const geometry =
    new THREE.ShapeGeometry(shape);

  const leaf =
    new THREE.Mesh(
      geometry,
      leafMaterial
    );

  leaf.scale.set(0.001, 0.001, 0.001);

  leaf.position.set(x, y, z);

  leaf.rotation.y = rotY;

  scene.add(leaf);

  /* animate leaf growth */

  let s = 0.001;

  function growLeaf() {

    s += 0.02;

    leaf.scale.set(s, s, s);

    if (s < 1) {
      requestAnimationFrame(growLeaf);
    }
  }

  growLeaf();
}

/* -------------------- */
/* BRANCH */
/* -------------------- */

class Branch {

  constructor(
    start,
    direction,
    length,
    thickness,
    depth
  ) {

    this.start = start.clone();
    this.direction = direction.clone();

    this.length = length;

    this.thickness = thickness;

    this.depth = depth;
  }

  grow() {

    if (this.depth <= 0) return [];

    const curve = new THREE.CatmullRomCurve3([

      this.start,

      this.start.clone().add(
        new THREE.Vector3(
          (Math.random() - 0.5) * 1,
          this.length * 0.5,
          (Math.random() - 0.5) * 1
        )
      ),

      this.start.clone().add(
        this.direction.clone()
          .multiplyScalar(this.length)
      )

    ]);

    const geometry =
      new THREE.TubeGeometry(
        curve,
        12,
        this.thickness,
        6,
        false
      );

    const stem =
      new THREE.Mesh(
        geometry,
        stemMaterial
      );

    stem.scale.y = 0.001;

    scene.add(stem);

    /* stem growth animation */

    let growth = 0.001;

    function animateStem() {

      growth += 0.03;

      stem.scale.y = growth;

      if (growth < 1) {
        requestAnimationFrame(animateStem);
      }
    }

    animateStem();

    const end =
      this.start.clone().add(
        this.direction.clone()
          .multiplyScalar(this.length)
      );

    /* add leaves */

    if (Math.random() < 0.9) {

      createLeaf(
        end.x,
        end.y,
        end.z,
        Math.random() * Math.PI
      );
    }

    const children = [];

    const amount =
      Math.floor(Math.random() * 2) + 1;

    for (let i = 0; i < amount; i++) {

      const dir =
        this.direction.clone();

      dir.x += (Math.random() - 0.5) * 0.8;
      dir.y += Math.random() * 0.6;
      dir.z += (Math.random() - 0.5) * 0.8;

      dir.normalize();

      children.push(

        new Branch(
          end,
          dir,
          this.length * 0.85,
          this.thickness * 0.8,
          this.depth - 1
        )

      );
    }

    return children;
  }
}

/* -------------------- */
/* START */
/* -------------------- */

let branches = [

  new Branch(

    new THREE.Vector3(0, -7, 0),

    new THREE.Vector3(0, 1, 0),

    4,

    0.12,

    7

  )

];

/* -------------------- */
/* GROW */
/* -------------------- */

function growPlant() {

  let next = [];

  branches.forEach(branch => {

    next.push(...branch.grow());

  });

  branches = next;
}

setInterval(growPlant, 1200);

/* -------------------- */
/* PARTICLES */
/* -------------------- */

for (let i = 0; i < 200; i++) {

  const p = new THREE.Mesh(

    new THREE.SphereGeometry(0.015, 4, 4),

    new THREE.MeshBasicMaterial({
      color: 0x000000
    })

  );

  p.position.set(
    (Math.random() - 0.5) * 40,
    (Math.random() - 0.5) * 40,
    (Math.random() - 0.5) * 40
  );

  scene.add(p);
}

/* -------------------- */
/* ANIMATION */
/* -------------------- */

function animate() {

  requestAnimationFrame(animate);

  scene.rotation.y += 0.0015;

  renderer.render(scene, camera);
}

animate();

/* -------------------- */
/* RESIZE */
/* -------------------- */

window.addEventListener("resize", () => {

  camera.aspect =
    window.innerWidth / window.innerHeight;

  camera.updateProjectionMatrix();

  renderer.setSize(
    window.innerWidth,
    window.innerHeight
  );

});

</script>

</body>
</html>
